name: Skills

# Checks every skill in skills/ and publishes each one as a ZIP on the release "skills",
# in the layout Claude accepts under Customize > Skills > Upload a skill. The ZIPs are
# build output, so they live on the release and not in the repo. Download links stay fixed:
# https://github.com/idob4474/rulings-index/releases/download/skills/<skill>.zip

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - skills/**
      - scripts/lookup.py
      - card/**
      - tools/**
      - .github/workflows/skills.yml
  pull_request:
    paths:
      - skills/**
      - scripts/lookup.py
      - card/**
      - tools/**
      - .github/workflows/skills.yml

permissions:
  contents: write

concurrency:
  group: skills
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every skill has a SKILL.md whose name is its folder
        run: |
          for d in skills/*/; do
            n=$(basename "$d")
            head -5 "$d/SKILL.md" | grep -q "^name: \"\?$n\"\?$" || { echo "::error::$d SKILL.md name must be $n"; exit 1; }
            head -5 "$d/SKILL.md" | grep -q '^description: ' || { echo "::error::$d SKILL.md has no description"; exit 1; }
            head -5 "$d/SKILL.md" | grep -Eq '^description: "[A-Z][^"]*\. Use for [^"]*\."$' || { echo "::error::$d description must be English, one sentence of what it does, then 'Use for ...'."; exit 1; }
            grep -m1 '^# ' "$d/SKILL.md" | grep -q 'למשפטים$' || { echo "::error::$d first heading must end with למשפטים"; exit 1; }
          done
      - name: Scripts compile
        run: python -m py_compile skills/*/scripts/*.py scripts/*.py tools/card/build.py
      - name: The skill's lookup.py is the one in scripts/
        run: cmp scripts/lookup.py skills/ruling-analyzer/scripts/lookup.py
      - name: card.js is built from tools/card, and the skill points at this card.js
        run: |
          python tools/card/build.py --out "$RUNNER_TEMP/card.js"
          cmp "$RUNNER_TEMP/card.js" card/card.js
          cmp "$RUNNER_TEMP/card.js" skills/ruling-analyzer/assets/card.js
          sha=$(grep -o 'rulings-index@[0-9a-f]\{40\}' skills/ruling-analyzer/scripts/render.py | cut -d@ -f2)
          git show "$sha:card/card.js" | cmp - card/card.js || { echo "::error::CARD_JS in render.py points at $sha, whose card.js is not the current one"; exit 1; }
      - name: The example card passes the checks and renders
        working-directory: skills/ruling-analyzer
        run: |
          python -I scripts/validate.py assets/example.json
          python -I scripts/render.py assets/example.json > "$RUNNER_TEMP/widget.html"
          python -I scripts/render.py assets/example.json --inline > "$RUNNER_TEMP/inline.html"
          grep -q 'cdn.jsdelivr.net/gh/idob4474/rulings-index@' "$RUNNER_TEMP/widget.html"
          grep -q 'window.HLCard' "$RUNNER_TEMP/inline.html"

      - name: The lecture example card passes the checks and renders
        working-directory: skills/ruling-analyzer
        run: |
          python -I scripts/validate.py ../lecture-summarizer/assets/example.json
          python -I scripts/render.py ../lecture-summarizer/assets/example.json > "$RUNNER_TEMP/lecture.html"
          grep -q 'cdn.jsdelivr.net/gh/idob4474/rulings-index@' "$RUNNER_TEMP/lecture.html"
      - name: The marketplace lists only skill folders that exist
        run: |
          python - <<'PY'
          import json, os, sys
          m = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          bad = [s for p in m["plugins"] for s in p["skills"] if not os.path.isfile(os.path.join(s, "SKILL.md"))]
          listed = {s for p in m["plugins"] for s in p["skills"]}
          missing = [f"./skills/{d}" for d in os.listdir("skills") if f"./skills/{d}" not in listed]
          if bad or missing:
              print("::error::marketplace.json mismatch", bad, missing); sys.exit(1)
          PY

  publish:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip each skill
        run: |
          mkdir -p dist
          cd skills
          for d in */; do
            n=${d%/}
            zip -rX "../dist/$n.zip" "$n" -x '*/__pycache__/*' '*.pyc' '*/.DS_Store'
          done
          ls -l ../dist
      - name: Publish on the release "skills"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: skills
        run: |
          R="$GITHUB_REPOSITORY"
          {
            echo "Skills for Claude, built from $GITHUB_SHA."
            echo
            echo "Download a ZIP and upload it in Claude under Customize > Skills > + > Create skill > Upload a skill. The source of every skill is in skills/ in this repo."
          } > notes.md
          if gh api "repos/$R/releases/tags/$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$R" --notes-file notes.md
          else
            gh release create "$TAG" -R "$R" --target "$GITHUB_SHA" --title "Skills" --notes-file notes.md --latest=false
          fi
          gh release upload "$TAG" -R "$R" --clobber dist/*.zip
          gh release view "$TAG" -R "$R" --json assets --jq '.assets[] | "\(.name) \(.size)"'
